name: Synthetic Windows batch guard test
on:
  push:
    branches: [anka-windows-cli-guard-53adde3dde]
    paths: ['.github/workflows/synthetic-cli-guard.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-2022
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify accepted arguments and rejected metacharacters
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, tempfile
          unsafe = frozenset('&|<>^%!()"')
          def allowed(*args):
              return all(value and not any(ch in unsafe or not ch.isprintable() for ch in value) for value in args)
          with tempfile.TemporaryDirectory(prefix="safe path ") as directory:
              root = pathlib.Path(directory)
              target = root / "target.py"
              target.write_text('import json,sys\nprint(json.dumps({"args":sys.argv[1:],"stdin":sys.stdin.read()}))\n', encoding='utf-8')
              wrapper = root / "fixture.cmd"
              wrapper.write_text('@echo off\r\n"' + sys.executable + '" "' + str(target) + '" %*\r\n', encoding='utf-8')
              tasks = [
                  ("turkish", "Türkçe finans raporunu incele."),
                  ("spaces", "iki boşluklu ifade"),
                  ("trailing_slash", "C:\\klasör boşluklu" + "\\"),
                  ("network_path", "\\\\sunucu\\klasör\\belge"),
                  ("punctuation", "v1.2, tamam: evet; soru?"),
              ]
              for name, task in tasks:
                  assert allowed(str(wrapper), task), name
                  process = subprocess.run([str(wrapper), "--print", task], input="", capture_output=True, text=True, shell=False, timeout=20)
                  observed = json.loads(process.stdout)
                  matched = process.returncode == 0 and observed["args"] == ["--print", task]
                  print(json.dumps({"name":name,"arguments_preserved":matched}, ensure_ascii=True))
                  assert matched, name
              for task in ['%CLI_PROBE_DUMMY%', 'A & B', 'a"b', 'a!b', 'a^b', 'a|b', 'a\nb', 'a(b)', 'a>b']:
                  assert not allowed(str(wrapper), task)
              marker = root / "marker.txt"
              task = 'raw stdin "%PATH%" & echo BAD > "' + str(marker) + '"'
              process = subprocess.run([str(wrapper), "--cd", str(root), "-"], input=task, capture_output=True, text=True, shell=False, timeout=20)
              observed = json.loads(process.stdout)
              assert observed["args"] == ["--cd", str(root), "-"] and observed["stdin"] == task and not marker.exists()
              print("WINDOWS_GUARD_SYNTHETIC_PASS")
